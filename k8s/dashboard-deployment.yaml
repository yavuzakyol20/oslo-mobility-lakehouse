apiVersion: apps/v1
kind: Deployment

metadata:
  name: mobility-dashboard-deployment
  namespace: oslo-mobility

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mobility-dashboard

  template:
    metadata:
      labels:
        app: mobility-dashboard

    spec:
      containers:
        - name: dashboard
          image: oslo-mobility-dashboard:latest
          imagePullPolicy: Never

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          envFrom:
            - configMapRef:
                name: dashboard-config
          env:
            - name: STORAGE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: dashboard-secret
                  key: STORAGE_ACCOUNT

          ports:
            - containerPort: 8501
